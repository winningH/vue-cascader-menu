name: Publish

# 推送 v* tag 触发:构建 → 发布 npmjs.com → 创建 GitHub Release
# 发版流程:本地 npm version patch|minor|major(自动 commit + 打 tag 并推送)→ 本 workflow 自动执行
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install and build
        run: |
          npm ci
          npm run build

      # 同版本重复推送(如 tag 重推)时 npm 会拒绝发布,容错跳过避免误报红叉
      - name: Publish to npmjs.com
        continue-on-error: true
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 依据 tag 创建 GitHub Release,自动汇总自上个版本以来的提交作为 release notes
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
